<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta
    name="description"
    content="Información legal y de privacidad de ATLAS, desarrollada por ChrisDevLabs."
  />

  <title>ATLAS — Legal</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #121212;
      --surface: #1b1b1b;
      --surface-hover: #202020;
      --border: #2d2d2d;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 48px 0;
      text-align: center;
    }

    .brand {
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 12px;
      font-size: clamp(42px, 9vw, 68px);
      line-height: 1;
    }

    .subtitle {
      margin: 0 auto 44px;
      max-width: 520px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .language-title {
      margin-bottom: 18px;
      font-size: 15px;
      font-weight: 700;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .language {
      display: block;
      padding: 24px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        transform 0.15s ease;
    }

    .language:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .language strong {
      display: block;
      margin-bottom: 5px;
      font-size: 19px;
    }

    .language span {
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--accent);
    }

    @media (max-width: 520px) {
      .languages {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">ChrisDevLabs</div>

    <h1>ATLAS</h1>

    <p class="subtitle">
      Información legal y privacidad · Legal information and privacy
    </p>

    <div class="language-title">
      Selecciona tu idioma · Select your language
    </div>

    <div class="languages">
      <a class="language" href="./es/">
        <strong>Español</strong>
        <span>Información legal de ATLAS</span>
      </a>

      <a class="language" href="./en/">
        <strong>English</strong>
        <span>ATLAS legal information</span>
      </a>
    </div>

    <footer>
      ATLAS · ChrisDevLabs<br />
      <a href="mailto:dev.atlastraining@gmail.com">
        dev.atlastraining@gmail.com
      </a>
    </footer>
  </main>
</body>
</html>
